name: HomeHub
options:
  bundleIdPrefix: de.magnus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  HomeHub:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.magnus.homehub
        PRODUCT_NAME: HomeHub
        INFOPLIST_KEY_CFBundleDisplayName: HomeHub
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Schützt den Notfall Power-Cycle deiner SmartLife-Steckdose vor versehentlichem Auslösen."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Ermöglicht direkten Zugriff auf deinen Raspberry Pi und HomeServer im lokalen WLAN."
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: HomeHub
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSFaceIDUsageDescription: "Schützt den Notfall Power-Cycle deiner SmartLife-Steckdose vor versehentlichem Auslösen."
        NSLocalNetworkUsageDescription: "Ermöglicht direkten Zugriff auf deinen Raspberry Pi und HomeServer im lokalen WLAN."
        UIUserInterfaceStyle: Dark
